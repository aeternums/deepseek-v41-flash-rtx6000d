# DeepSeek-V4.1-Flash on 4x RTX 6000D (SM120), TP4, DSpark5.
# Values below are the configuration measured in README.md.
name: ds41-flash

services:
  ds41:
    image: ${IMAGE:-ghcr.io/local-inference-lab/vllm:karmic-kraken-20261016.2}
    container_name: ${NAME:-ds41-flash}
    init: true
    restart: "no"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"
    shm_size: 16g
    ulimits:
      # Engram tables and the CUDA allocator pin host memory; a low memlock
      # limit shows up as a startup failure, not as a slow start.
      memlock:
        soft: ${MEMLOCK_BYTES:-274877906944}
        hard: ${MEMLOCK_BYTES:-274877906944}
    environment:
      PROFILE: ds41-flash
      HARDWARE_PROFILE: rtx-pro-6000-pcie
      MODEL: /models/DeepSeek-V4.1-Flash-1017-lossless-CSF
      TP: "4"
      PORT: "8000"
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${MODEL_DIR:-/models/DeepSeek-V4.1-Flash-1017-lossless-CSF}:/models/DeepSeek-V4.1-Flash-1017-lossless-CSF:ro
      - ${CACHE_DIR:-/data/ds41/cache}:/cache
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia1:/dev/nvidia1
      - /dev/nvidia2:/dev/nvidia2
      - /dev/nvidia3:/dev/nvidia3
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    command:
      - --checkpoint
      - csf
      - --served-model-name
      - ${SERVED_NAME:-DeepSeek-V4.1-Flash}
      # Explicit speculation config wins over the profile default; --mode off
      # cancels that default so only the config below applies.
      - --mode
      - "off"
      - --max-model-len
      - "1048576"
      - --max-num-seqs
      - "16"
      - --max-num-batched-tokens
      - "4096"
      - --gpu-memory-utilization
      - "0.95"
      - --engram-table-memory
      - ram
      - --kv-cache-dtype
      - fp8
      - --max-cudagraph-capture-size
      - "64"
      - --speculative-config
      - '{"method":"dspark","attention_backend":"B12X","draft_sample_method":"probabilistic","rejection_sample_method":"standard","num_speculative_tokens":5,"draft_tensor_parallel_size":4,"enable_adaptive_verification":true,"adaptive_verification_cost_scale":1.0}'
      - --limit-mm-per-prompt
      - '{"image":4}'
